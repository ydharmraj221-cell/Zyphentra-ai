
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyphentra AI — Video Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f4f6ff}
header{padding:22px;text-align:center;border-bottom:1px solid #29314a}
h1{margin:0;color:#8b9cff}
main{max-width:760px;margin:30px auto;padding:20px}
.panel{background:#141c31;border:1px solid #303b5b;border-radius:18px;padding:22px}
p{color:#c2cbe2;line-height:1.6}
label{display:block;margin:18px 0 8px}
textarea,select{width:100%;padding:14px;border-radius:10px;border:1px solid #465273;background:#0b1020;color:white;font-size:16px}
button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:10px;background:#687cff;color:white;font-size:17px;font-weight:bold}
button:disabled{opacity:.55}
#status{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere}
video{width:100%;margin-top:18px;border-radius:12px;background:#000}
a{color:#aebaff}
.small{font-size:13px;color:#aab5d0}
</style>
</head>
<body>
<header>
  <h1>ZYPhENTRA AI</h1>
  <p>Turn your ideas into videos</p>
</header>

<main>
  <div class="panel">
    <h2>AI Video Generator</h2>
    <p>अपना आइडिया लिखो और AI वीडियो बनाने की रिक्वेस्ट भेजो।</p>

    <label for="prompt">वीडियो में क्या दिखाना है?</label>
    <textarea id="prompt" rows="5" maxlength="2000"
      placeholder="उदाहरण: रात में एक रहस्यमयी पुराने महल में चलता हुआ एक बहादुर लड़का, सिनेमैटिक हॉरर स्टाइल..."></textarea>

    <label for="ratio">वीडियो का आकार</label>
    <select id="ratio">
      <option value="16:9">16:9 — YouTube</option>
      <option value="9:16">9:16 — Shorts / Reels</option>
      <option value="1:1">1:1 — Square</option>
    </select>

    <p class="small">अभी यह सेटअप 5 सेकंड का टेस्ट वीडियो माँगता है। वीडियो बनाने पर fal.ai शुल्क लगा सकता है।</p>

    <button id="generate">Generate Video</button>
    <div id="status" role="status">तैयार है। वीडियो बनाने से पहले शुल्क जाँच लेना।</div>
    <video id="video" controls playsinline hidden></video>
    <p id="download" hidden><a id="downloadLink" href="#" target="_blank" rel="noopener">वीडियो खोलें / डाउनलोड करें</a></p>
  </div>
</main>

<script>
const button = document.getElementById("generate");
const statusBox = document.getElementById("status");
const video = document.getElementById("video");
const download = document.getElementById("download");
const downloadLink = document.getElementById("downloadLink");

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

button.addEventListener("click", async () => {
  const prompt = document.getElementById("prompt").value.trim();
  const ratio = document.getElementById("ratio").value;

  if (!prompt) {
    statusBox.textContent = "पहले वीडियो का आइडिया लिखो।";
    return;
  }

  button.disabled = true;
  video.hidden = true;
  download.hidden = true;
  statusBox.textContent = "रिक्वेस्ट भेजी जा रही है...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt, aspect_ratio: ratio})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "रिक्वेस्ट भेजने में समस्या हुई।");
    }

    if (!data.request_id) {
      throw new Error("सर्वर से request ID नहीं मिली।");
    }

    statusBox.textContent = "रिक्वेस्ट स्वीकार हुई। वीडियो तैयार होने का इंतज़ार करो...";

    for (let attempt = 0; attempt < 120; attempt++) {
      await wait(5000);

      const check = await fetch(
        "/api/generate?request_id=" + encodeURIComponent(data.request_id)
      );
      const result = await check.json();

      if (!check.ok) {
        throw new Error(result.error || "वीडियो का स्टेटस नहीं मिल पाया।");
      }

      if (result.status === "COMPLETED" && result.videoUrl) {
        video.src = result.videoUrl;
        video.hidden = false;
        downloadLink.href = result.videoUrl;
        download.hidden = false;
        statusBox.textContent = "वीडियो तैयार है! नीचे Play दबाकर देखो।";
        return;
      }

      if (result.status === "FAILED" || result.status === "ERROR") {
        throw new Error("वीडियो जनरेट नहीं हुआ। fal.ai की रिक्वेस्ट और लॉग चेक करो।");
      }

      statusBox.textContent =
        "वीडियो तैयार हो रहा है...\nस्टेटस: " + (result.status || "PROCESSING") +
        "\nकृपया इस पेज को खुला रखो।";
    }

    statusBox.textContent =
      "अभी परिणाम नहीं मिला। बाद में फिर स्टेटस चेक करना; दोबारा Generate दबाने से दूसरी रिक्वेस्ट बन सकती है।";

  } catch (error) {
    statusBox.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
