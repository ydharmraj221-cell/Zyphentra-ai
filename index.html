<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyphentra AI — Video Studio</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080b14;color:#f5f7ff;font-family:Arial,sans-serif}
    header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20263a}
    .logo{font-size:25px;font-weight:800;color:#8c7bff}
    .tag{font-size:12px;color:#b8c0d9;border:1px solid #343b55;padding:8px 12px;border-radius:20px}
    main{max-width:900px;margin:55px auto;padding:20px}
    .hero{text-align:center;margin-bottom:35px}
    h1{font-size:clamp(34px,7vw,58px);margin:10px 0}
    h1 span{color:#9c8cff}
    .sub{color:#aab2ca;line-height:1.7}
    .panel{background:#111626;border:1px solid #2a3149;border-radius:22px;padding:24px}
    label{display:block;font-size:14px;margin:18px 0 10px;color:#d9def0}
    textarea,select{width:100%;background:#090e1b;color:white;border:1px solid #343c57;border-radius:12px;padding:15px;font-size:15px}
    textarea{min-height:135px;resize:vertical}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    button{width:100%;margin-top:22px;border:0;border-radius:12px;padding:16px;background:linear-gradient(100deg,#705cff,#b04dff);color:white;font-size:16px;font-weight:bold;cursor:pointer}
    button:hover{opacity:.9}
    #status{margin-top:18px;padding:14px;background:#090e1b;border-radius:10px;color:#c4cbe0;line-height:1.6}
    .preview{margin-top:20px}
    video{width:100%;border-radius:12px;background:#05070d}
    footer{text-align:center;padding:35px 15px;color:#747e9b;font-size:13px}
    @media(max-width:550px){.grid{grid-template-columns:1fr}main{margin:25px auto;padding:14px}.panel{padding:17px}header{padding:17px}}
  </style>
</head>
<body>
  <header>
    <div class="logo">✦ ZYPHENTRA AI</div>
    <div class="tag">AI VIDEO STUDIO</div>
  </header>

  <main>
    <section class="hero">
      <div class="tag">YOUR IDEAS, YOUR UNIVERSE</div>
      <h1>Create videos with <span>AI.</span></h1>
      <p class="sub">Describe your imagination. Prepare your video generation request in seconds.</p>
    </section>

```
<section class="panel">
  <label for="prompt">Describe your video</label>
  <textarea id="prompt" placeholder="Example: A cinematic shot of a futuristic Indian city at night, flying cars, glowing lights, ultra realistic, 4K..."></textarea>

  <div class="grid">
    <div>
      <label for="duration">Video duration</label>
      <select id="duration">
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>
    <div>
      <label for="style">Video style</label>
      <select id="style">
        <option>Cinematic</option>
        <option>Realistic</option>
        <option>Anime</option>
        <option>Fantasy</option>
        <option>Horror</option>
        <option>Documentary</option>
      </select>
    </div>
  </div>

  <button id="generate">Generate Video</button>
  <div id="status" role="status">Ready. Enter a prompt to prepare your video request.</div>
  <div id="preview" class="preview"></div>
</section>
```

  </main>

  <footer>© 2026 Zyphentra AI · Creative tools for everyone</footer>

  <script>
    const promptBox = document.getElementById('prompt');
    const statusBox = document.getElementById('status');
    const button = document.getElementById('generate');
    const preview = document.getElementById('preview');

    button.addEventListener('click', async () => {
      const prompt = promptBox.value.trim();
      if (!prompt) {
        statusBox.textContent = 'Please enter a description for your video first.';
        promptBox.focus();
        return;
      }

      statusBox.textContent = 'Your prompt is ready, but video generation is not connected yet. A secure server connection to the AI video provider must be configured first.';
      preview.innerHTML = '';
    });
  </script>

</body>
</html>
