<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyphentra AI — Direct AI Video Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- हेडर -->
        <header>
            <div class="logo">ZYPHENTRA <span class="accent">AI</span></div>
            <p class="tagline">टेक्स्ट से सीधे असली AI वीडियो जनरेटर</p>
        </header>

        <!-- मुख्य डैशबोर्ड -->
        <main class="dashboard">
            <!-- बाएं: कंट्रोल्स पैनल -->
            <section class="controls-panel">
                <div class="input-group">
                    <label for="prompt">अपना वीडियो प्रॉम्प्ट या कहानी लिखें:</label>
                    <textarea id="prompt" placeholder="उदा. एक खंडहर खेल का मैदान, शाम का समय, सिनेमैटिक शॉट..." rows="4"></textarea>
                </div>

                <div class="settings-grid">
                    <div class="control-item">
                        <label for="aspect-ratio">आस्पेक्ट रेशियो</label>
                        <select id="aspect-ratio">
                            <option value="16:9">16:9 (YouTube)</option>
                            <option value="9:16">9:16 (Reels)</option>
                            <option value="1:1">1:1 (Square)</option>
                        </select>
                    </div>

                    <div class="control-item">
                        <label for="style">वीडियो स्टाइल</label>
                        <select id="style">
                            <option value="cinematic">Cinematic</option>
                            <option value="realistic">Realistic 4K</option>
                            <option value="horror">Horror / Dark</option>
                            <option value="anime">Anime</option>
                        </select>
                    </div>
                </div>

                <button id="generate-btn" onclick="startVideoGeneration()">Generate Video</button>
            </section>

            <!-- दाएं: वीडियो प्लेयर पैनल -->
            <section class="preview-panel">
                <div class="player-container">
                    <!-- लोडिंग और प्रोग्रेस बार -->
                    <div id="status-overlay" class="status-overlay hidden">
                        <div class="spinner"></div>
                        <p id="status-text">प्रोसेसिंग चालू है...</p>
                        <div class="progress-bar-container">
                            <div id="progress-bar" class="progress-bar"></div>
                        </div>
                    </div>

                    <!-- असली वीडियो प्लेयर -->
                    <video id="video-player" controls class="hidden"></video>
                    
                    <!-- खाली स्क्रीन का टेक्स्ट -->
                    <div id="player-placeholder" class="player-placeholder">
                        <span>आपका AI वीडियो यहाँ दिखाई देगा</span>
                    </div>
                </div>

                <!-- डाउनलोड बटन -->
                <div class="action-buttons">
                    <a id="download-btn" class="btn download-btn disabled" download="zyphentra-ai-video.mp4">Download Video</a>
                </div>
            </section>
        </main>
    </div>

    <!-- असली AI वीडियो जनरेशन जावास्क्रिप्ट लॉजिक -->
    <script>
        async function startVideoGeneration() {
            const promptInput = document.getElementById('prompt').value.trim();
            if (!promptInput) {
                alert('कृपया पहले कोई प्रॉम्प्ट लिखें!');
                return;
            }

            const btn = document.getElementById('generate-btn');
            const statusOverlay = document.getElementById('status-overlay');
            const statusText = document.getElementById('status-text');
            const progressBar = document.getElementById('progress-bar');
            const videoPlayer = document.getElementById('video-player');
            const placeholder = document.getElementById('player-placeholder');
            const downloadBtn = document.getElementById('download-btn');

            // UI रीसेट करें
            btn.disabled = true;
            statusOverlay.classList.remove('hidden');
            videoPlayer.classList.add('hidden');
            placeholder.classList.add('hidden');
            downloadBtn.classList.add('disabled');
            
            statusText.innerText = "AI सर्वर को रिक्वेस्ट भेजी जा रही है...";
            progressBar.style.width = "15%";

            try {
                // बैकएंड सर्वरलेस फंक्शन को रिक्वेस्ट भेजना
                const response = await fetch('/api/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptInput,
                        aspect_ratio: document.getElementById('aspect-ratio').value,
                        style: document.getElementById('style').value
                    })
                });

                const data = await response.json();
                if (!response.ok || data.error) throw new Error(data.error || "सर्वर एरर।");

                // जॉब आईडी मिलने पर रीयल-टाइम पोलिंग (चेकिंग) चालू करना
                if (data.job_id) {
                    statusText.innerText = "वीडियो रेंडर हो रहा है (GPU Processing)...";
                    progressBar.style.width = "40%";
                    
                    let videoUrl = null;
                    // अधिकतम 40 बार चेक करेगा (लगभग 2 मिनट)
                    for (let i = 0; i < 40; i++) { 
                        await new Promise(r => setTimeout(r, 4000)); // हर 4 सेकंड में चेक करेगा
                        
                        const statusCheck = await fetch(`/api/generate-video?job_id=${data.job_id}`);
                        const statusData = await statusCheck.json();
                        
                        // प्रोग्रेस बार को स्मूथली बढ़ाना
                        let currentProgress = 40 + (i * 1.5);
                        if(currentProgress > 95) currentProgress = 95;
                        progressBar.style.width = currentProgress + "%";

                        if (statusData.status === 'COMPLETED') {
                            videoUrl = statusData.video_url;
                            break;
                        } else if (statusData.status === 'FAILED') {
                            throw new Error("AI मॉडल वीडियो नहीं बना पाया।");
                        }
                    }

                    if (!videoUrl) throw new Error("टाइमआउट! दोबारा ट्राई करें।");
                    displayVideo(videoUrl);
                } else {
                    throw new Error("जॉब आईडी नहीं मिली।");
                }
            } catch (error) {
                statusText.innerText = "त्रुटि: " + error.message;
                progressBar.style.width = "0%";
                btn.disabled = false;
                setTimeout(() => statusOverlay.classList.add('hidden'), 5000);
            }
        }

        // प्लेयर में वीडियो लोड करने और प्ले करने का फंक्शन
        function displayVideo(url) {
            document.getElementById('generate-btn').disabled = false;
            document.getElementById('status-overlay').classList.add('hidden');
            
            const vp = document.getElementById('video-player');
            vp.classList.remove('hidden');
            vp.src = url;
            vp.load();
            vp.play().catch(e => console.log("Auto-play blocked"));
            
            const db = document.getElementById('download-btn');
            db.classList.remove('disabled');
            db.href = url;
        }
    </script>
</body>
</html>
