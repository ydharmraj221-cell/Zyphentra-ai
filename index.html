<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyphentra AI — Direct AI Video Generator</title>
    <style>
        :root {
            --bg-dark: #0a0a14;
            --panel-dark: #121225;
            --input-bg: #1a1a36;
            --accent-neon: #00ffcc;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #8a8fa8;
            --border-color: #252545;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding: 15px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 480px; }
        header { text-align: center; margin-bottom: 25px; }
        .logo { font-size: 2.2rem; font-weight: 800; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        .logo span { color: var(--accent-neon); text-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .tagline { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; font-weight: 500; }
        
        .studio-card { background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 18px; }
        .card-title { font-size: 1.4rem; font-weight: 700; background: linear-gradient(90deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        textarea, select { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; padding: 14px; font-size: 0.95rem; outline: none; resize: none; transition: all 0.3s ease; }
        textarea:focus, select:focus { border-color: var(--accent-neon); box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        #generate-btn { background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        #generate-btn:hover:not(:disabled) { background: linear-gradient(135deg, #2563eb, #1e40af); transform: translateY(-1px); }
        #generate-btn:disabled { background: #222538; color: #555; cursor: not-allowed; box-shadow: none; }

        /* प्लेयर और लोडिंग ओवरले */
        .output-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; position: relative; overflow: hidden; border: 1px solid var(--border-color); margin-top: 10px; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px; font-style: italic; }
        
        .status-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.05); border-top-color: var(--accent-neon); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-box { width: 80%; height: 5px; background: #161726; border-radius: 3px; margin-top: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent-neon); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px var(--accent-neon); }
        
        #error-text { color: #ff4a4a; font-size: 0.85rem; margin-top: 5px; text-align: center; font-weight: 500; }
        .download-zone { display: flex; justify-content: center; margin-top: 5px; }
        .download-btn { width: 100%; text-align: center; background: #1a1a36; color: #fff; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 600; border: 1px solid var(--border-color); font-size: 1rem; transition: all 0.3s ease; }
        .download-btn:hover:not(.disabled) { background: var(--accent-neon); color: var(--bg-dark); border-color: var(--accent-neon); box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        .disabled { opacity: 0.2; pointer-events: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">Zyphentra <span>AI</span></div>
            <p class="tagline">Direct AI Video Generation Studio</p>
        </header>

        <main class="studio-card">
            <div class="card-title">AI Video Prompt Studio</div>
            
            <div class="input-group">
                <label>Your Idea / कहानी का आइडिया</label>
                <textarea id="prompt" placeholder="Ek ganv me khandahar maidan, horror style, cinematic look..." rows="4"></textarea>
            </div>

            <div class="row-grid">
                <div class="input-group">
                    <label>Visual Style</label>
                    <select id="style">
                        <option value="Horror">Horror</option>
                        <option value="Cinematic Realistic">Cinematic Realistic</option>
                        <option value="Anime">Anime</option>
                        <option value="3D Animation">3D Animation</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Aspect Ratio</label>
                    <select id="aspect-ratio">
                        <option value="16:9">16:9 (YouTube)</option>
                        <option value="9:16">9:16 (Reels/Shorts)</option>
                        <option value="1:1">1:1 (Square)</option>
                    </select>
                </div>
            </div>

            <button id="generate-btn" onclick="generateRealVideo()">✦ Generate Video</button>
            <div id="error-text" class="hidden"></div>

            <!-- वीडियो आउटपुट एरिया -->
            <div class="output-container">
                <div id="status-overlay" class="status-overlay hidden">
                    <div class="spinner"></div>
                    <p id="status-text">AI सर्वर कनेक्ट हो रहा है...</p>
                    <div class="progress-box">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </div>

                <video id="video-player" controls class="hidden"></video>
                
                <div id="placeholder-text" class="placeholder">
                    <span>आपका AI वीडियो यहाँ दिखाई देगा</span>
                </div>
            </div>

            <div class="download-zone">
                <a id="download-btn" class="download-btn disabled" download="zyphentra_video.mp4">Download Video</a>
            </div>
        </main>
    </div>

    <script>
        // ⚠️ अपनी सीक्रेट Fal.ai की यहाँ पेस्ट करें ताकि यह सीधे गिटहब पेजेस पर काम करे
        const FAL_KEY = "यहाँ_अपनी_FAL_KEY_पेस्ट_करें"; 

        async function generateRealVideo() {
            const promptVal = document.getElementById('prompt').value.trim();
            const errorDiv = document.getElementById('error-text');
            errorDiv.classList.add('hidden');

            if (FAL_KEY === "यहाँ_अपनी_FAL_KEY_पेस्ट_करें" || !FAL_KEY) {
                alert('कृपया कोड की लाइन नंबर 132 में अपनी Fal.ai की API Key दर्ज करें!');
                return;
            }
            if (!promptVal) {
                alert('कृपया पहले कोई कहानी या प्रॉम्प्ट लिखें!');
                return;
            }

            const btn = document.getElementById('generate-btn');
            const overlay = document.getElementById('status-overlay');
            const statusText = document.getElementById('status-text');
            const pBar = document.getElementById('progress-bar');
            const player = document.getElementById('video-player');
            const placeholder = document.getElementById('placeholder-text');
            const dlBtn = document.getElementById('download-btn');

            btn.disabled = true;
            overlay.classList.remove('hidden');
            player.classList.add('hidden');
            placeholder.classList.add('hidden');
            dlBtn.classList.add('disabled');
            
            statusText.innerText = "AI कतार (Queue) में जुड़ रहे हैं...";
            pBar.style.width = "15%";

            try {
                const styleVal = document.getElementById('style').value;
                const aspectVal = document.getElementById('aspect-ratio').value;
                const finalPrompt = `${promptVal}, ${styleVal} style, high quality, 4k, cinematic detailed`;

                // सीधे फ्रंटएंड से Fal.ai API को कॉल करना
                const response = await fetch("https://fal.run", {
                    method: "POST",
                    headers: {
                        "Authorization": `Key ${FAL_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: finalPrompt,
                        aspect_ratio: aspectVal,
